[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "no-defaults"
version = "2026.9.1"
description = "A fast Python linter that forbids function and dataclass defaults."
readme = "README.md"
license = "MIT"
authors = [{ name = "Adam Dangoor", email = "adamdangoor@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]
keywords = ["lint", "defaults", "dataclasses", "pre-commit"]
dependencies = ["ty>=0.0.52"]

[project.urls]
Source = "https://github.com/adamtheturtle/no-defaults"
Issues = "https://github.com/adamtheturtle/no-defaults/issues"
Changelog = "https://github.com/adamtheturtle/no-defaults/blob/main/CHANGELOG.rst"

[project.optional-dependencies]
release = [ "check-wheel-contents==0.6.3", "towncrier==25.8.0" ]

[tool.uv]
# Release tooling requires Python 3.10+. Resolve the lock for that floor so
# CI can `uv run --extra release` while the package keeps requires-python >=3.9.
environments = [ "python_version >= '3.10'" ]

[tool.towncrier]
# The changelog and the per-release GitHub release notes are both built
# from news fragments under ``newsfragments/``.  The release workflow
# runs ``towncrier build`` to assemble them; contributors add one
# fragment file per user-facing change.
directory = "newsfragments"
filename = "CHANGELOG.rst"
# Custom template so an assembled version reproduces the historical
# style exactly: a bare ``<version>`` heading (no project name, no
# date) followed by a flat bullet list with no per-type sub-headings.
template = "towncrier_template.rst.jinja"
title_format = "{version}"
# ``title_format`` underline first, then any nested headings.  A bare
# version such as ``2026.05.18`` underlined with ``-`` matches every
# pre-towncrier entry in CHANGELOG.rst.
underlines = [ "-", "~", "^" ]
issue_format = "#{issue}"
type = [
    # A single, unnamed fragment type keeps the assembled output as one
    # flat bullet list, matching the historical changelog (which never
    # grouped entries under "Features"/"Bugfixes"/... sub-headings).
    { directory = "change", name = "", showcontent = true },
]

[tool.maturin]
bindings = "bin"
module-name = "no_defaults"
