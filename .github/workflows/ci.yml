name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv tool install ty==0.0.64
      - run: ty version
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release

  hawk:
    runs-on: ubuntu-latest
    env:
      HAWK_VERSION: 0.1.15
      HAWK_SHA256: c50189129c43f026b19a0e7da2a405ab2599ff9426a826f7db8ab64d7274d1d5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain required by Hawk
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: ". -> target/hawk"
      - name: Install Hawk
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/hawk.tar.gz" \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${HAWK_SHA256}  ${RUNNER_TEMP}/hawk.tar.gz" | sha256sum --check
          tar --extract --file "${RUNNER_TEMP}/hawk.tar.gz" --directory "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/cargo-hawk-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"
      - name: Check Rust visibility
        run: cargo hawk check --target-dir target/hawk -D warnings -D hawk::unnecessary_crate_visibility

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-machete@0.9.2
      - name: Check for unused Rust dependencies
        run: cargo machete

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - name: Check Rust dependency policy
        run: cargo deny --locked check -D warnings

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - name: Check Python package metadata
        run: uv run --locked --only-group dev pyroma --min 10 .

  docs:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.19.0
      VALE_SHA256: c8f9d6c8055442bc7e9c121b2498e6f0e3fb670f4665e6ee577f1897f7665cf6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv tool install docutils==0.23
      - name: Install Vale
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/vale.tar.gz" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  ${RUNNER_TEMP}/vale.tar.gz" | sha256sum --check
          tar --extract --file "${RUNNER_TEMP}/vale.tar.gz" --directory "${RUNNER_TEMP}" vale
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Download the pinned styles
        run: vale sync
      - run: vale .

  msrv:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: msrv-${{ matrix.os }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-msrv@0.19.3
      - name: Verify the declared minimum Rust version
        run: cargo msrv verify --no-log -- cargo check --locked --all-targets --all-features
