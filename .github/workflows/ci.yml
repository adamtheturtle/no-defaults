name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release

  docs:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: 3.19.0
      VALE_SHA256: c8f9d6c8055442bc7e9c121b2498e6f0e3fb670f4665e6ee577f1897f7665cf6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Vale
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/vale.tar.gz" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  ${RUNNER_TEMP}/vale.tar.gz" | sha256sum --check
          tar --extract --file "${RUNNER_TEMP}/vale.tar.gz" --directory "${RUNNER_TEMP}" vale
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Download the pinned styles
        run: vale sync
      - run: vale .
