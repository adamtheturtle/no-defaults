[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "no-defaults"
version = "0.2.0"
description = "A fast Python linter that forbids function and dataclass defaults."
readme = "README.md"
license = "MIT"
authors = [{ name = "Adam Dangoor", email = "adamdangoor@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]
keywords = ["lint", "defaults", "dataclasses", "pre-commit"]

[project.urls]
Source = "https://github.com/adamtheturtle/no-defaults"
Issues = "https://github.com/adamtheturtle/no-defaults/issues"

[tool.maturin]
bindings = "bin"
module-name = "no_defaults"
