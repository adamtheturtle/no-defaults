[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "no-defaults"
version = "2026.9.1"
description = "A fast Python linter that forbids function and dataclass defaults."
# Avoid Pyroma treating parameterized Markdown as reStructuredText.
# https://github.com/regebro/pyroma/issues/135
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
authors = [{ name = "Adam Dangoor", email = "adamdangoor@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]
keywords = ["lint", "defaults", "dataclasses", "pre-commit"]
dependencies = ["ty>=0.0.52"]

[project.urls]
Source = "https://github.com/adamtheturtle/no-defaults"
Issues = "https://github.com/adamtheturtle/no-defaults/issues"
Changelog = "https://github.com/adamtheturtle/no-defaults/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [ "pyroma==5.0.1" ]
release = [ "check-wheel-contents==0.6.3", "towncrier==26.9.0" ]

[tool.uv]
# Release tooling requires Python 3.10+. Resolve the lock for that floor so
# CI can `uv run --group release` while the package keeps requires-python >=3.9.
environments = [ "python_version >= '3.10'" ]

[tool.towncrier]
# Write the same native Markdown file used by documentation and GitHub releases.
directory = "newsfragments"
filename = "changelog/{version}.md"
# The template renders the release heading and preserves semantic line breaks.
template = ".github/towncrier_template.md.jinja"
title_format = false
issue_format = "[#{issue}](https://github.com/adamtheturtle/no-defaults/issues/{issue})"
single_file = false
# Reject invalid fragment names instead of silently losing release entries.
ignore = [ ".gitkeep" ]
type = [ { directory = "change", name = "Changes", showcontent = true } ]

[tool.maturin]
bindings = "bin"
module-name = "no_defaults"
