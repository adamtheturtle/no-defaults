[package]
name = "no-defaults"
version = "2.1.0"
edition = "2021"
rust-version = "1.83"
description = "A fast Python linter that forbids function and dataclass defaults"
license = "MIT"
readme = "README.md"
repository = "https://github.com/adamtheturtle/no-defaults"
homepage = "https://github.com/adamtheturtle/no-defaults"
documentation = "https://github.com/adamtheturtle/no-defaults#readme"

[[bin]]
name = "no-defaults"
path = "src/main.rs"

[[bench]]
name = "lint"
harness = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.12"
ruff_python_ast = { package = "rustpython-ruff_python_ast", version = "0.15.8" }
ruff_python_parser = { package = "rustpython-ruff_python_parser", version = "0.15.8" }
ruff_text_size = { package = "rustpython-ruff_text_size", version = "0.15.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
toml = "1"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
exacl = "0.13"
xattr = "1.6"

[dev-dependencies]
divan = { package = "codspeed-divan-compat", version = "5.0.1" }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
