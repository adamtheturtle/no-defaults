name: Typeshed benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions: {}

jobs:
  typeshed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv tool install ty==0.0.64
      - name: Build optimized binary
        run: cargo build --locked --release
      - name: Check out pinned Typeshed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: python/typeshed
          ref: a75102fa81ec49fcac4facc98ea6cd5e32567983
          path: benchmark/typeshed
          persist-credentials: false
      - name: Run real-project benchmark
        run: bash scripts/benchmark-typeshed.sh benchmark/typeshed 10
